name: Build Mobile Release (Android)

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build --if-present

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK (Release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare Release Asset
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-assets
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "dist-assets/Mori-v${VERSION}-Android-Unsigned.apk" || cp android/app/build/outputs/apk/release/app-release.apk "dist-assets/Mori-v${VERSION}-Android.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mori-Android-APK
          path: dist-assets/*.apk

      - name: Upload Release Asset (Android)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
